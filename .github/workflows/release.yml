name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package Metronome.app
        run: scripts/package-app.sh "${GITHUB_REF_NAME#v}"
      - name: Zip and checksum
        run: |
          ZIP="Metronome-${GITHUB_REF_NAME#v}.zip"
          # ditto keeps the bundle's symlinks, permissions, and signature intact.
          ditto -c -k --sequesterRsrc --keepParent build/Metronome.app "build/$ZIP"
          (cd build && shasum -a 256 "$ZIP" > "$ZIP.sha256" && cat "$ZIP.sha256")
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$ZIP" "build/$ZIP.sha256" \
            --title "Metronome ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
